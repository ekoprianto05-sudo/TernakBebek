<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="10 10"/>
  
  <!-- Duck body -->
  <g transform="translate(45, 60)">
    <!-- Main Body -->
    <path d="M120 280 C120 340 180 370 270 370 C340 370 390 320 390 270 C390 220 350 200 300 210 C260 218 240 190 240 160 C240 110 200 70 150 70 C100 70 70 105 70 150 C70 190 100 220 120 280 Z" fill="url(#duckGrad)" />
    
    <!-- Wing -->
    <path d="M220 240 C280 230 340 270 340 300 C340 320 290 340 230 330 C190 323 180 280 220 240 Z" fill="#ca8a04" opacity="0.8" />
    
    <!-- Beak -->
    <path d="M75 145 C40 145 10 160 5 175 C0 190 40 185 80 175 Z" fill="url(#beakGrad)" />
    
    <!-- Eye -->
    <circle cx="130" cy="130" r="14" fill="#0f172a" />
    <circle cx="125" cy="125" r="4" fill="#ffffff" />
    
    <!-- Egg Badge in corner -->
    <g transform="translate(260, 240)">
      <ellipse cx="60" cy="70" rx="36" ry="46" fill="url(#eggGrad)" filter="drop-shadow(0 6px 8px rgba(0,0,0,0.25))" />
      <!-- Egg sheen -->
      <path d="M46 50 C46 40 54 36 64 36" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
  </g>
  
  <!-- Brand text banner -->
  <text x="256" y="465" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="#f0fdf4" text-anchor="middle" letter-spacing="3">DUCKFARM PRO</text>
</svg>
